services:
    app:
        stop_grace_period: 5m
        build:
            context: .
            dockerfile: docker/Dockerfile
        ports:
            - "8080:8080"
        volumes:
            - .:/app:Z
            - app_data:/app/var
        environment:
            APP_ENV: dev
            APP_DEBUG: 1
            DATABASE_URL: "sqlite:///%kernel.project_dir%/var/data.db"
            HOST_UID: "${HOST_UID:-1000}"
            HOST_GID: "${HOST_GID:-1000}"

volumes:
    app_data:
