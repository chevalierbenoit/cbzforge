# Dashboard welcome screen
dashboard.welcome_title: Bienvenue dans cbzforge
dashboard.welcome_lead: cbzforge lit vos dossiers de BD, récupère leurs métadonnées et renomme les fichiers de façon cohérente. Commençons par votre première bibliothèque.
dashboard.add_first: Ajouter ma première bibliothèque
dashboard.step1_title: Ajouter un dossier
dashboard.step1_text: Indiquez le chemin d'un dossier qui contient vos BD (CBZ, CBR ou PDF). Les fichiers sont lus sur place.
dashboard.step2_title: Trouver les métadonnées
dashboard.step2_text: Sélectionnez une BD et recherchez ses métadonnées. Seules les sources activées et configurées sont proposées.
dashboard.step2_link: Vérifier les sources de métadonnées
dashboard.step3_title: Renommer de façon cohérente
dashboard.step3_text: Choisissez une expression de nommage. Les fichiers sont renommés depuis la racine de la bibliothèque, dans un dossier par série.

