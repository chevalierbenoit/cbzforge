# Dashboard welcome screen
dashboard.welcome_title: Welcome to cbzforge
dashboard.welcome_lead: cbzforge reads your comic folders, finds their metadata and renames files consistently. Let's set up your first library.
dashboard.add_first: Add my first library
dashboard.step1_title: Add a library folder
dashboard.step1_text: Give the path of a folder that holds your comics (CBZ, CBR or PDF). Files are read in place.
dashboard.step2_title: Find the metadata
dashboard.step2_text: Select a comic and search its metadata. Only enabled and configured sources are offered.
dashboard.step2_link: Check the metadata sources
dashboard.step3_title: Rename consistently
dashboard.step3_text: Choose a naming expression. Files are renamed from the library root, into one folder per series.

